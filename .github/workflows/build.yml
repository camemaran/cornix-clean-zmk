name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4
        with:
          path: user-config

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            ~/.cache/zephyr
            /tmp/zmk-workspace
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/west.yml') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install West
        run: pip install west

      - name: Initialize West Workspace
        run: |
          mkdir -p /tmp/zmk-workspace/config
          # ⭕ Westのバグを避けるため、Gitの標準機能で本家ZMKを100%安全にダウンロードします
          git clone --depth 1 --branch v0.3.0 https://github.com /tmp/zmk-workspace/zmk
          
          # ⭕ あなたのクリーンな設定ファイルを完璧な位置に移植します
          cp -r user-config/config/* /tmp/zmk-workspace/config/
          
          cd /tmp/zmk-workspace
          # ⭕ ローカル（手元）にあるファイルだけを使ってWest環境を安全に初期化します
          west init -l config
          west update
          
      - name: Install Python Dependencies
        run: |
          pip install -r /tmp/zmk-workspace/zephyr/scripts/requirements.txt

      - name: Build Left Firmware
        run: |
          cd /tmp/zmk-workspace
          west build -b cornix_left -s zmk/app -- -DZMK_CONFIG=/tmp/zmk-workspace/config

      - name: Build Right Firmware
        run: |
          cd /tmp/zmk-workspace
          west build -b cornix_right -s zmk/app -- -DZMK_CONFIG=/tmp/zmk-workspace/config

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cornix_clean_firmware
          path: |
            /tmp/zmk-workspace/build/zephyr/zmk.uf2
